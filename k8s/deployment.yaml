apiVersion: apps/v1
kind: Deployment
metadata:
  name: cats-dogs-mlops
  labels:
    app: cats-dogs-mlops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cats-dogs-mlops
  template:
    metadata:
      labels:
        app: cats-dogs-mlops
    spec:
      containers:
        - name: api
          image: ghcr.io/sampathshetty85/cats-dogs-mlops:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
