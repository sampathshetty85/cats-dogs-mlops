name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install torch==2.4.1+cpu torchvision==0.19.1+cpu \
            --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: flake8 src/ tests/ --max-line-length=120

      - name: Test
        run: pytest tests/ -v --tb=short

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate model for Docker build
        run: |
          pip install torch==2.4.1+cpu --index-url https://download.pytorch.org/whl/cpu -q
          python -c "
          import torch, os, sys
          sys.path.insert(0, '.')
          from src.model.architecture import SimpleCNN
          os.makedirs('models', exist_ok=True)
          m = SimpleCNN()
          torch.save(m.state_dict(), 'models/cats_dogs_cnn.pt')
          print('Synthetic model generated for CI Docker build')
          "

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/cats-dogs-mlops:latest
            ghcr.io/${{ github.repository_owner }}/cats-dogs-mlops:${{ github.sha }}
